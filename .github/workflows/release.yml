name: release

# Tags publish; the manual run builds without releasing, to try the build.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true
      - run: go vet ./...
      - run: go test ./...

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      # The tag names the version the build carries, so a release cannot
      # ship a version its tag disagrees with.
      - name: Check the tag matches mygo.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content mygo.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            throw "tag $env:GITHUB_REF_NAME does not match mygo.json v$version"
          }

      - name: Build
        run: go tool mygo build

      - name: Pack the portable build
        shell: pwsh
        run: |
          $version = (Get-Content mygo.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force build/portable | Out-Null
          Copy-Item "build/windows-amd64/mobi2zip.exe" "build/portable/mobi2zip.exe"
          Compress-Archive -Path "build/portable/mobi2zip.exe" `
            -DestinationPath "build/mobi2zip-$version-windows-amd64.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: windows-amd64
          path: |
            build/windows-amd64/*.exe
            build/*.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/windows-amd64/mobi2zip-setup-*.exe
            build/mobi2zip-*-windows-amd64.zip
          generate_release_notes: true
