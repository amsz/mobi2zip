# Pushing a tag such as v0.1.1 builds the Windows app and uploads it to a
# draft release of the tag, which is published by hand: check the build,
# then publish it.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # the draft release, and the uploads to it

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The tag names the version the build carries, so a release cannot
      # ship a version its tag disagrees with.
      - name: Check the tag matches mygo.json
        run: test "$GITHUB_REF_NAME" = "v$(jq -r .version mygo.json)"

      # The release page takes its notes from the changelog's section for
      # this version, in place of GitHub's from the pull requests.
      - name: Take the notes from the changelog
        run: |
          awk -v heading="## ${GITHUB_REF_NAME#v}" '
            /^## / { inside = ($0 == heading); next }
            inside
          ' CHANGELOG.md | sed '/./,$!d' > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --draft --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
          fi

  build:
    needs: draft
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      # A portable build only: the exe runs where it is unpacked, with no
      # installer and nothing written to the registry.
      - name: Build
        run: go tool mygo build -skip-installer

      # The asset carries the version it was built from, so a downloaded
      # file says which release it belongs to.
      - name: Name the asset
        shell: pwsh
        run: |
          $version = (Get-Content mygo.json -Raw | ConvertFrom-Json).version
          Move-Item "build/windows-amd64/mobi2zip.exe" `
            "build/windows-amd64/mobi2zip-$version-windows-amd64.exe"

      - name: Upload to the draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$env:GITHUB_REF_NAME" build/windows-amd64/*.exe --clobber
