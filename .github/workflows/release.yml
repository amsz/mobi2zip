name: release

# Tags publish; the manual run builds without releasing, to try the build.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true
      - run: go vet ./...
      - run: go test ./...

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      # The tag names the version the build carries, so a release cannot
      # ship a version its tag disagrees with.
      - name: Check the tag matches mygo.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content mygo.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            throw "tag $env:GITHUB_REF_NAME does not match mygo.json v$version"
          }

      # A portable build only: the exe runs where it is unpacked, with no
      # installer and nothing written to the registry.
      - name: Build
        run: go tool mygo build -skip-installer

      # The asset carries the version it was built from, so a downloaded
      # file says which release it belongs to.
      - name: Name the asset
        shell: pwsh
        run: |
          $version = (Get-Content mygo.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force build/release | Out-Null
          Copy-Item "build/windows-amd64/mobi2zip.exe" `
            "build/release/mobi2zip-$version-windows-amd64.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-amd64
          path: build/release/*.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/release/*.exe
          generate_release_notes: true
